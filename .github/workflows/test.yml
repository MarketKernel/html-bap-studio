name: test
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The page reaches nothing by itself: no external script, style or font may slip into the file.
      - run: "! grep -E '<script[^>]+src=|<link[^>]+href=\"https?:' build/bap.html"
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: bap-studio
          path: |
            build/bap.html
            build/pages/
