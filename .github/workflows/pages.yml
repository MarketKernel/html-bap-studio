name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push does not cancel one already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The page reaches nothing by itself: no external script, style or font may slip into the file.
      - run: "! grep -E '<script[^>]+src=|<link[^>]+href=\"https?:' build/pages/index.html"
      # Opens build/pages/ too: the service worker takes the page over.
      - run: npm run test:browser

      # Only build/pages/: its service worker answers every navigation in its scope with the
      # studio, so build/finance.html could not be opened next to it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
